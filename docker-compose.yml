version: '3.8' 

services:
  db:
    image: postgres:latest 
    container_name: vacation_db_container
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: vacation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: